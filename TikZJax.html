<body>

  <h1>Apollonian Circle Example</h1>

  <p>
      An <b>Apollonian Circle</b> is the set of all points P in a plane such that the ratio of the distances from P to two fixed points, A and B, is a constant value k. That is, $PA/PB = k$.
  </p>
  <p>
      This diagram shows the case where $A=(4,0)$, $B=(1,0)$, and the ratio $k=2$.
  </p>

  <div class="tikz-container">
    <script type="text/tikz">
      \usetikzlibrary{calc}
      \begin{tikzpicture}[
        scale=1.2, % Overall scaling
        dot/.style={circle, fill, inner sep=2pt} % Style for points
      ]
        % --- Parameters ---
        % Define coordinates of A and B using macros
        \def\Ax{4} \def\Ay{0}
        \def\Bx{1}  \def\By{0}
        \def\k{2}

        % Define the coordinates for drawing
        \coordinate (A) at (\Ax,\Ay);
        \coordinate (B) at (\Bx,\By);

        % --- Calculation ---
        % Calculate center and radius using the macros
        \pgfmathsetmacro{\cx}{((\k*\k*\Bx) - \Ax) / (\k*\k - 1)}
        \pgfmathsetmacro{\cy}{((\k*\k*\By) - \Ay) / (\k*\k - 1)}
        \pgfmathsetmacro{\distAB}{sqrt((\Bx-\Ax)^2 + (\By-\Ay)^2)}
        \pgfmathsetmacro{\radius}{(abs(\k) / (\k*\k-1)) * \distAB}

        % --- Now use the calculated macros ---
        \coordinate (C) at (\cx, \cy);

        % --- Drawing Commands ---
        % Draw faint coordinate axes
        \draw[->, gray!50] (-6,0) -- (8,0) node[right] {$x$};
        \draw[->, gray!50] (0,-4) -- (0,4) node[above] {$y$}; 

        % Draw the Apollonian circle
        \draw[blue, thick, line cap=round] (C) circle (\radius);

        % Draw and label the base points A and B
        \node[dot, label=below:{\large $A (4,0)$}] at (A) {};
        \node[dot, label=below:{\large $B (1,0)$}] at (B) {};

        % Label the calculated center C
        \node[dot, red, label=below right:{\color{red}\large $C$}] at (C) {};

        % Pick a sample point P on the circle (e.g., at the 110-degree position)
        \coordinate (P) at ($(C) + (110:\radius)$);
        \node[dot, green!50!black, label=above:{\color{green!50!black}\large $P$}] at (P) {};

        % Draw the distance lines PA and PB
        \draw[gray, dashed] (P) -- (A) node[midway, above, sloped] {$PA$};
        \draw[gray, dashed] (P) -- (B) node[midway, below, sloped] {$PB$};

        % Add a note with the formula below the diagram
        \node[blue, align=center] at (1,-3.5) {Any point $P$ on this circle satisfies \ \Large $\frac{PA}{PB} = \k$};

      \end{tikzpicture}
    </script>
  </div>

</body>
